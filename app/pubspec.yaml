name: crew_link
description: Crew Link — convoy GPS sync, push-to-talk and CarPlay companion.
publish_to: none
version: 1.0.0+9

environment:
  # An die tatsaechliche Lockfile-Floor angeglichen (vendored SDK 3.41.9);
  # die alten Werte (Dart 3.4 / Flutter 3.22) konnten den Dependency-Graph
  # nicht aufloesen (maplibre_gl, synchronized, path_provider_foundation …).
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.38.4"

dependencies:
  cloud_firestore: ^5.4.4
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  logger: ^2.4.0
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  geolocator: ^13.0.1
  app_links: ^6.3.0
  go_router: ^14.0.0
  http: ^1.2.2
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.3.5
  package_info_plus: ^8.0.2
  uuid: ^4.4.0
  web_socket_channel: ^3.0.1
  flutter_local_notifications: ^17.2.2
  maplibre_gl: ^0.26.1
  latlong2: ^0.9.0
  livekit_client: ^2.2.0
  flutter_webrtc: ^0.12.12+hotfix.1
  sentry_flutter: ^8.10.0
  sign_in_with_apple: ^6.1.2
  posthog_flutter: ^5.25.2
  crypto: ^3.0.5
  battery_plus: ^6.0.3
  share_plus: ^12.0.2
  wakelock_plus: ^1.3.3

dev_dependencies:
  build_runner: ^2.4.13
  fake_async: ^1.3.3
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  integration_test:
    sdk: flutter
  stream_channel: ^2.1.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App-Icon aus dem orangenen Link-Squircle generieren:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
